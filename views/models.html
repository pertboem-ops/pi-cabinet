<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内阁·阁员模型</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 76px 14px 14px; /* 顶部 46px 宿主拖拽区 + 余量 */
    font: 13px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f7f7f8; color: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #181818; color: #e5e5e7; }
    .card { background: #232325 !important; }
    table, th, td { border-color: #3a3a3d !important; }
    select, button { background: #2c2c2e !important; color: #e5e5e7 !important; border-color: #48484c !important; }
  }
  .card { background: #fff; border: 1px solid #e2e2e5; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .bar { border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
  .bar.warn { background: #fff3cd; border: 1px solid #ffe08a; color: #6d5600; }
  .bar.ok { background: #d4edda; border: 1px solid #a8dcb5; color: #1e5631; }
  .bar.info { background: #e2e8f8; border: 1px solid #b6c4e8; color: #2c3d66; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #e2e2e5; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { font-size: 12px; background: rgba(127,127,127,.08); white-space: nowrap; }
  td .file { color: #888; font-size: 11px; display: block; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; background: rgba(127,127,127,.15); }
  .muted { color: #888; font-size: 11.5px; }
  select { max-width: 210px; width: 100%; padding: 3px 4px; font-size: 12.5px; border: 1px solid #c9c9cd; border-radius: 5px; background: #fff; color: #1c1c1e; }
  button { padding: 5px 14px; font-size: 12.5px; border: 1px solid #b9b9bf; border-radius: 6px; background: #fff; color: #1c1c1e; cursor: pointer; }
  button.primary { background: #3478f6; border-color: #3478f6; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .dirty { color: #a05a00; font-weight: 600; font-size: 12.5px; }
  details { margin-top: 6px; }
  pre.audit { max-height: 200px; overflow: auto; font-size: 11px; background: rgba(127,127,127,.07); padding: 6px; border-radius: 6px; white-space: pre-wrap; }
  .hint { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// —— 建议表（D3-b 裁定：静态嵌入；与源码树 ministers/README 家族分配表同源，
//    verify 断言逐字一致；装机后 README 再改不跟随的窗口以表头小字披露）——
const SUGGEST = {
  "cabinet-feng": { family: "Kimi", thinking: "high" },
  "cabinet-ju": { family: "DeepSeek", thinking: "max" },
  "cabinet-li": { family: "GLM 高配档", thinking: "high" },
  "cabinet-mou": { family: "GLM 经济档", thinking: null },
  "cabinet-shen": { family: "DeepSeek", thinking: "max" },
  "cabinet-yuan": { family: "Kimi", thinking: "high" },
  "cabinet-gu": { family: "Kimi", thinking: "high" },
  "cabinet-zhong": { family: "DeepSeek", thinking: "max" },
};

const app = document.getElementById("app");
let state = null;

function familyOf(key) { const s = typeof key === "string" ? key : ""; return s.includes("/") ? s.split("/")[0] : s; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
async function invoke(channel, payload) { return window.pluginBridge.invoke(channel, payload); }
function copyText(t) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(t).catch(() => {});
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch {}
  ta.remove();
  return Promise.resolve();
}

function render() {
  if (!state) { app.innerHTML = '<div class="card">加载中…</div>'; return; }
  const s = state;
  const bars = [];

  if (!s.authorized) {
    app.innerHTML =
      '<div class="card"><p><b>阁员定义目录授权</b></p>' +
      '<p>阁员定义在 <code>%USERPROFILE%\\.agents\\subagents</code>。面板需要一次目录授权（宿主重启后会失效，需重新授权）。</p>' +
      '<button class="primary" onclick="authorize()">授权</button></div>';
    return;
  }
  if (s.rootPathOk === false) {
    bars.push('<div class="bar warn"><b>授权目录异常</b>：面板预期 <code>…\\.agents\\subagents</code>，当前 ' + esc(s.rootPath) +
      '。写错目录 = 改定无效（要白跑一场才暴露；D 盘 ministers\\ 副本是典型陷阱）。确认无误请点「仍然使用」。</div>');
  }
  const feng = s.seats.find((x) => x.file === "cabinet-feng.md");
  if (feng && s.sessionModelKey && familyOf(feng.model) === familyOf(s.sessionModelKey)) {
    bars.push('<div class="bar warn"><b>异源警示</b>：锋席当前钉扎与会话模型同家族（' + esc(familyOf(feng.model)) +
      '）。<span class="hint">当前仅自动核对锋席 vs 会话模型；据/审/众等席位间互撞请按 ministers/README 人工核对（后续版本扩展）。</span></div>');
  }
  const offline = !Array.isArray(s.models) || s.models.length === 0;
  if (offline) {
    bars.push('<div class="bar warn"><b>模型清单不可用</b>（宿主未就绪、models.list 返回空或权限未授予）。' +
      (s.modelsError ? '真实错误：<code>' + esc(s.modelsError) + '</code>。' : '') +
      '下拉暂不可用；若错误含 permission/denied 字样，请在插件页检查本插件权限（manifest 声明了 models.list）或卸载后重装让权限确认重新弹出。</div>');
  }
  if (s._saveMsg) bars.push('<div class="bar ok">' + s._saveMsg + '</div>');
  if (s._exportMsg) bars.push('<div class="bar info">' + s._exportMsg + '</div>');

  const subModels = (s.models || []).filter((m) => m.availableForSubagents === true);
  const inList = new Set((s.models || []).map((m) => m.key));

  // PM-14：下拉喂全量清单（availableForSubagents 默认 false——宿主绑定不显式
  // 标记即 false，但钉扎模型属"显式指定"路径不受此 gate，八阁员现状实证可用）；
  // 标志降为显示标注，不再做过滤（过滤条件系单侧观察过拟合，装机实证推翻）。
  const allModels = Array.isArray(s.models) ? s.models : [];
  const subOnly = allModels.filter((m) => m.availableForSubagents === true);

  const rows = s.seats.map((seat) => {
    const id = seat.file.replace(/\.md$/, "");
    const sug = SUGGEST[id] || { family: "—", thinking: null };
    const opts = [];
    opts.push('<option value=""' + (seat.model === null ? " selected" : "") + '>继承会话默认（删除 model 行）</option>');
    for (const m of allModels) {
      const sel = seat.model === m.key ? " selected" : "";
      const dis = offline ? " disabled" : "";
      const mark = m.availableForSubagents === true ? "" : " ·未标记子代理可用";
      opts.push('<option value="' + esc(m.key) + '"' + sel + dis + '>' + esc(m.label || m.key) + mark + "</option>");
    }
    if (seat.model && !opts.some((o) => o.includes('value="' + esc(seat.model) + '"'))) {
      const dis = offline ? " disabled" : "";
      opts.push('<option value="' + esc(seat.model) + '" selected' + dis + '>' + esc(seat.model) + "（当前值不在宿主清单：可能离线或宿主改名；保存后由下一场开场披露核对）</option>");
    }
    const modelCell = '<select data-file="' + esc(seat.file) + '" data-orig="' + esc(seat.model ?? "") + '">' + opts.join("") + "</select>" +
      (offline ? '<br><span class="hint">清单不可用：仅可切换「继承会话默认」（null 保存不依赖清单）</span>' : (subOnly.length === 0 && allModels.length > 0 ? '<br><span class="hint">注：当前清单中无已标记"可用于子智能体"的模型——按显式钉扎路径保存均可，未标记项照常可选。</span>' : ""));
    return "<tr><td>" + esc(seat.seat) + '<span class="file">' + esc(seat.file) + "</span></td>" +
      "<td>" + esc(seat.model || "（继承）") + '<br><span class="badge">' + esc(seat.family || "?") + "</span></td>" +
      "<td>" + esc(sug.family) + "</td>" +
      "<td>" + (sug.thinking ? esc(sug.thinking) : "—") + '</td><td style="min-width:200px">' + modelCell + "</td></tr>";
  }).join("");

  const dirty = s.dirtySinceLastExport ? '<span class="dirty">● 改定后未导出（D 盘 ministers\\ 未同步）</span>' : "";
  const audit = (s.auditTail || []).slice().reverse().map((e) =>
    esc(e.ts + "  " + e.agent + ":  " + (e.from || "（继承）") + " → " + (e.to === null ? "（继承）" : e.to) + (e.notInList ? "  [notInList]" : ""))
  ).join("\n") || "（暂无记录）";

  app.innerHTML =
    bars.join("") +
    '<div class="card">' +
    '<div class="muted">授权目录：' + esc(s.rootPath) + ' <button onclick="authorize()" style="padding:1px 8px;font-size:11px">重新授权</button></div>' +
    '<table><thead><tr><th>席位</th><th>当前钉扎</th><th>建议家族 *</th><th>建议 TL *</th><th>模型</th></tr></thead>' +
    "<tbody>" + rows + "</tbody></table>" +
    '<div class="hint" style="margin-top:4px">* 建议列以 ministers/README 为准（本版不写盘 thinkingLevel，仍需手动改文件）。</div>' +
    '<div class="actions">' +
    '<button class="primary" onclick="save()">保存改动</button>' +
    '<button onclick="exportSeats()">导出变更包</button>' +
    (s.lastExportPath ? '<button onclick="copyPath()">复制导出路径</button>' : "") +
    dirty +
    "</div>" +
    (offline ? "" : "") +
    "</div>" +
    '<details class="card"><summary>改定记录（审计 jsonl 尾部，只读）</summary><pre class="audit">' + audit + "</pre></details>";
}

async function loadState(extra) {
  try {
    state = Object.assign(await invoke("cabinet/state"), extra || {});
    state.lastExportPath = state.lastExportPath || (extra || {}).lastExportPath;
    render();
  } catch (e) {
    app.innerHTML = '<div class="card">面板通道错误：' + esc(e?.message || e) + "</div>";
  }
}
async function authorize() {
  try {
    const r = await invoke("cabinet/authorize");
    if (!r.ok) { app.innerHTML = '<div class="card">授权失败：' + esc(r.error) + "</div>"; return; }
    await loadState();
  } catch (e) { app.innerHTML = '<div class="card">授权异常：' + esc(e?.message || e) + "</div>"; }
}
async function save() {
  const changes = [];
  for (const sel of document.querySelectorAll("select[data-file]")) {
    if (!sel.disabled) {
      const v = sel.value === "" ? null : sel.value;
      const orig = sel.dataset.orig === "" ? null : sel.dataset.orig;
      if (v !== orig) changes.push({ file: sel.dataset.file, model: v });
    }
  }
  if (changes.length === 0) { await loadState({ _saveMsg: "没有改动。" }); return; }
  const r = await invoke("cabinet/save", { changes });
  if (!r.ok) { await loadState({ _saveMsg: "保存失败：" + esc(r.error) }); return; }
  let msg = "已写入 " + r.written + " 件。<b>下一场议事生效</b>；进行中的场次仍按开场时的钉扎执行（F6-01）。";
  if (Array.isArray(r.notInList) && r.notInList.length) {
    msg += " ⚠ " + r.notInList.map((n) => esc(n.file) + "=" + esc(n.model)).join("、") + " 不在宿主清单，下一场开场披露将核对。";
  }
  if (r.modelsUnavailable) {
    msg += " ⚠ 本次保存时模型清单不可用（" + esc(r.modelsUnavailable) + "），未做清单命中核对；下一场开场披露将核对。";
  }
  await loadState({ _saveMsg: msg });
}
async function exportSeats() {
  const r = await invoke("cabinet/export");
  if (!r.ok) { await loadState({ _exportMsg: "导出失败：" + esc(r.error) }); return; }
  let msg = "";
  if (r.kind === "bundle") {
    msg = "已导出拼合文件（宿主不允许写授权目录外，走 root 内单文件方案）：" + esc(r.path) +
      "。文件头注释里有拆分命令：把文件拷到 D 盘 ministers\\，在该目录执行文件头那行 pwsh 命令即拆出八件原名 .md，然后跑 ministers-check.ps1。";
  } else {
    msg = "已导出 " + r.files + " 件到：" + esc(r.path) + "。拷回 D 盘 ministers\\ 覆盖后跑 ministers-check.ps1。";
  }
  await loadState({ _exportMsg: msg, lastExportPath: r.path });
}
async function copyPath() {
  if (state?.lastExportPath) await copyText(state.lastExportPath);
}
window.authorize = authorize; window.save = save; window.exportSeats = exportSeats; window.copyPath = copyPath;
render();
loadState();
</script>
</body>
</html>
